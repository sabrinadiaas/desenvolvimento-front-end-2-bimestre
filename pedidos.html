<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <title>Doces da Iza - Pedidos</title>
</head>
<body>
    <div id="header-container"></div>
    <main>
        <h1 class="title">Faça seu pedido:</h1>
       <form>
            <label for="name">Nome:</label><br>
            <input type="text" id="name" name="name"><br><br>
            <label for="phone">Telefone:</label><br>
            <input type="phone" id="phone" name="phone"><br><br>
            <label for="mensagem">Pedido:</label><br>
            <textarea id="pedido" name="pedido" rows="7" placeholder="Descreva seu pedido aqui..."></textarea><br>
            <button type="submit">Enviar</button>
        </form>
        </form>
    </main>
    <div id="footer-container"></div>
    <script src="js/componentes.js"></script>
</body>
</html>
