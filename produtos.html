<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/responsive.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no"/>
    <title>Doces da Iza - Cardápio</title>
</head>
<body>
    <div id="header-container"></div>
    <main>
        <div class="carrosel" data-carousel="docinhos">
            <h2>DOCINHOS</h2>
            <div class="carrossel-container">
                <button class="carrosel-btn prev-btn">‹</button>
                <div class="slides">
                    <img src="img/docinhos1.png" alt="Docinhos 1">
                    <img src="img/docinhos2.png" alt="Docinhos 2">
                    <img src="img/docinhos3.png" alt="Docinhos 3">
                    <img src="img/docinhos4.png" alt="Docinhos 4">
                    <img src="img/docinhos5.png" alt="Docinhos 5">
                    <img src="img/docinhos6.png" alt="Docinhos 6">
                </div>
                <button class="carrosel-btn next-btn">›</button>
            </div>
            <div class="carrossel-indicators">
                <div class="indicator active" data-slide="0"></div>
                <div class="indicator" data-slide="1"></div>
                <div class="indicator" data-slide="2"></div>
                <div class="indicator" data-slide="3"></div>
            </div>
        </div>
        
        <div class="carrosel" data-carousel="bolos">
            <h2>BOLOS CONFEITADOS</h2>
            <div class="carrossel-container">
                <button class="carrosel-btn prev-btn">‹</button>
                <div class="slides">
                    <img src="img/bolo1.png" alt="Bolo 1">
                    <img src="img/bolo2.png" alt="Bolo 2">
                    <img src="img/bolo3.png" alt="Bolo 3">
                    <img src="img/bolo4.png" alt="Bolo 4">
                    <img src="img/bolo5.png" alt="Bolo 5">
                    <img src="img/bolo6.png" alt="Bolo 6">
                </div>
                <button class="carrosel-btn next-btn">›</button>
            </div>
            <div class="carrossel-indicators">
                <div class="indicator active" data-slide="0"></div>
                <div class="indicator" data-slide="1"></div>
                <div class="indicator" data-slide="2"></div>
                <div class="indicator" data-slide="3"></div>
            </div>
        </div>
        
        <div class="carrosel" data-carousel="doces-festa">
            <h2>DOCES DE FESTA</h2>
            <div class="carrossel-container">
                <button class="carrosel-btn prev-btn">‹</button>
                <div class="slides">
                    <img src="img/bombom_pistache.png" alt="Bombom pistache">
                    <img src="img/bombom_morango.png" alt="Bombom morango">
                    <img src="img/bolo_gelado.png" alt="Bolo gelado">
                    <img src="img/brownie_casado.png" alt="Brownie casado">
                    <img src="img/pao_de_mel.png" alt="Pão de mel">
                    <img src="img/degustacao.png" alt="Degustação">
                </div>
                <button class="carrosel-btn next-btn">›</button>
            </div>
            <div class="carrossel-indicators">
                <div class="indicator active" data-slide="0"></div>
                <div class="indicator" data-slide="1"></div>
                <div class="indicator" data-slide="2"></div>
                <div class="indicator" data-slide="3"></div>
            </div>
        </div>
    </main>
    <div id="footer-container"></div>
    <script src="js/componentes.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
